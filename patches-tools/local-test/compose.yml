# Local test server for Munin Map. It copies the live server where that matters for the mod,
# and starts as fast as possible. See README.md next to this file.
#
#   valheim  the test server (deploy.ps1): a local image that starts the game directly
#   update   the live image with its own startup (update.ps1 only): steamcmd + BepInEx merge
#
# WORLD_NAME, SERVER_ARGS, PUID and PGID come from .env, which pull-save.ps1 writes from the
# live server's docker-compose.yml.
name: munin-test

# The image the live server runs. update.ps1 and deploy.ps1 warn when live moves to another one.
x-base-image: &base-image ghcr.io/community-valheim-tools/valheim-server:1.4.1

x-env: &env
  # --- as on live (from .env) ---
  PUID: ${PUID:-1000}
  PGID: ${PGID:-1000}
  WORLD_NAME: ${WORLD_NAME:?run pull-save.ps1 first}
  SERVER_ARGS: ${SERVER_ARGS:-}
  # --- test only ---
  SERVER_NAME: "${WORLD_NAME} test"
  SERVER_PORT: 2456
  SERVER_PUBLIC: "false"
  SERVER_PASS: ""                  # no password: not public, and only reachable from the local machine
  CROSSPLAY: "false"               # crossplay stops the server taking inbound UDP, so it couldn't be joined by IP
  BEPINEX: "true"
  STATUS_HTTP: "false"             # needs a public server
  BACKUPS: "false"
  UPDATE_CRON: ""
  RESTART_CRON: ""
  STEAMCMD_ARGS: ""                # update only; re-checking every file over a Windows-drive mount took ~38 s
  # predict_ore = in-place test knobs (TASK-4.6), from the shell that runs deploy.ps1; empty: off
  MUNIN_INPLACE_ALL: ${MUNIN_INPLACE_ALL:-}        # 1: predict generated zones too, to compare with a generated copy
  MUNIN_INPLACE_BLOCK: ${MUNIN_INPLACE_BLOCK:-}    # none | physics (default)
  MUNIN_INPLACE_BUDGET_MS: ${MUNIN_INPLACE_BUDGET_MS:-}
  MUNIN_INPLACE_THREADS: ${MUNIN_INPLACE_THREADS:-}        # worker threads (default 2)
  MUNIN_INPLACE_FRESH: ${MUNIN_INPLACE_FRESH:-}            # 1: start again rather than resume
  MUNIN_INPLACE_STOP_AFTER: ${MUNIN_INPLACE_STOP_AFTER:-}  # N: stop after N zones, as if interrupted
  MUNIN_INPLACE_MEASURE_LOCATIONS: ${MUNIN_INPLACE_MEASURE_LOCATIONS:-}  # 1: measure loading the location prefabs first
  MUNIN_INPLACE_CHECKED: ${MUNIN_INPLACE_CHECKED:-}        # pretend in-place was checked against this game version
  MUNIN_INPLACE_ZONE_DELAY_MS: ${MUNIN_INPLACE_ZONE_DELAY_MS:-}  # N: pause N ms after each zone, to watch the order

x-ports: &ports
  # 127.0.0.1 only: nothing else on the network can reach the test server
  - 127.0.0.1:2456-2457:2456-2457/udp
  - 127.0.0.1:3000:3000/tcp        # Munin Map

services:
  valheim:
    build:
      context: ./image
      args:
        BASE_IMAGE: *base-image
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: munin-test-fast
    container_name: munin-test
    init: true                     # forwards SIGTERM, so the world is saved on stop
    stop_grace_period: 60s
    cap_add: [SYS_NICE]
    environment: *env
    ports: *ports
    volumes:
      - ./data/config:/config      # world, plugin, Munin settings
      # The merged server + BepInEx install, copied here by update.ps1. On a Docker volume the
      # game starts ~9 s faster than from a Windows-drive mount.
      - server:/opt/valheim
      # Munin's tiles, stats and models: tens of thousands of files, kept off the Windows drive.
      # pull-save.ps1 points Munin's data_path here.
      - munin-data:/home/valheim/munin-data

  update:
    profiles: [update]
    image: *base-image
    container_name: munin-test-update
    stop_grace_period: 60s
    cap_add: [SYS_NICE]
    environment: *env
    ports: *ports
    volumes:
      - ./data/config:/config
      - ./data/server:/opt/valheim  # steamcmd install, the merged copy, downloads; the build compiles against it
      - munin-data:/home/valheim/munin-data

volumes:
  server:
  munin-data:
